# Agentic — isolated tmux config loaded only when launched on the
# -L agentic socket. Never reads the user's ~/.tmux.conf.

set -g default-terminal "tmux-256color"
# Advertise features of VS Code's integrated terminal (TERM=xterm-256color):
# RGB true colour, bracketed paste so VS Code pastes are forwarded as one
# chunk (Claude sees them as a paste, not a stream of keystrokes), and
# clipboard for OSC52.
set -as terminal-features ",xterm-256color:RGB:bpaste:clipboard"

# Let unknown DCS / OSC escape sequences pass through to the inner program.
# Required for image paste from VS Code (iTerm2 OSC 1337 inline-image
# protocol) and other terminal-graphics formats Claude consumes — without
# this, tmux 3.3+ silently strips them and the inner program never sees
# the image.
set -g allow-passthrough on

# No prefix — Claude owns key input; VS Code keeps chords like Ctrl-B.
unbind-key -a
set -g prefix None

# Wheel scrolling works via mouse mode. Claude is launched with
# CLAUDE_CODE_DISABLE_MOUSE=1 so it doesn't fight tmux for wheel events.
set -g mouse on

# Small history — enough to scroll back a few screenfuls, low memory.
set -g history-limit 2000

# Per-client viewport + redraw on attach.
set -g window-size latest
setw -g aggressive-resize on

# No status bar — saves a row and prevents Claude fullscreen clipping.
set -g status off

# Sessions survive last detach — that's the whole point.
set -g destroy-unattached off
set -g remain-on-exit on

# Don't enable csi-u — breaks Claude's bracketed paste.
set -s extended-keys off

# Mouse-drag selection copies via OSC52 to the host terminal clipboard
# and exits copy-mode immediately, so it feels like a normal terminal.
set -g set-clipboard on
set -g mode-style "bg=#264f78,fg=default"
bind-key -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel
